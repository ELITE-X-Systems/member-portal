name: Update ELITE X Member Portal

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portal
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install openpyxl google-api-python-client google-auth

      - name: Download private Excel from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service-account.json

          python - <<'PY'
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          FILE_ID = "1hR4AxAnRH-MdVXF28hdA8A8e68hsFWCl"

          credentials = service_account.Credentials.from_service_account_file(
              "service-account.json",
              scopes=["https://www.googleapis.com/auth/drive.readonly"]
          )

          drive = build("drive", "v3", credentials=credentials)

          request = drive.files().get_media(fileId=FILE_ID)

          with open("ELITE X Records.xlsx", "wb") as f:
              downloader = MediaIoBaseDownload(f, request)

              done = False
              while not done:
                  _, done = downloader.next_chunk()

          print("Excel downloaded successfully.")
          PY

      - name: Generate public portal data
        run: python scripts/build_data.py "ELITE X Records.xlsx"

      - name: Remove private files
        run: rm -f "ELITE X Records.xlsx" service-account.json

      - name: Commit updated public data
        run: |
          git config user.name "ELITE X Portal Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No portal data changes."
          else
            git commit -m "Update public member portal data"
            git push
          fi
